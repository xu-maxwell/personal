      const calculateYearsSince = (year, month, day) => {
        const startDate = new Date(year, month - 1, day); // month - 1 because Date months are 0-indexed
        const today = new Date();

        const timeDifferenceInMilliseconds =
          today.getTime() - startDate.getTime();

        // Average milliseconds in a year (using 365.2425 days for more accuracy with leap years)
        const millisecondsPerYear = 1000 * 60 * 60 * 24 * 365.2425;

        const ageInYearsWithFraction =
          timeDifferenceInMilliseconds / millisecondsPerYear;

        // Format the number to two decimal places and return it as a string
        return ageInYearsWithFraction.toFixed(2);
      };
